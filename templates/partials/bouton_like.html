{% comment %}Bouton « J'aime » partagé. Paramètres : cible (article), aime (bool, optionnel), muet (true = simple compteur).{% endcomment %}
{% if muet %}
  <span class="like actif" title="Tu ne peux pas aimer ton propre article">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3S4.8 15.8 4.8 10.9A4.3 4.3 0 0 1 12 8.1a4.3 4.3 0 0 1 7.2 2.8c0 4.9-7.2 9.4-7.2 9.4Z"/></svg>
    <span>{{ cible.nb_likes }}</span>
  </span>
{% else %}
  <form method="post" action="{% url 'aimer' cible.pk %}" class="like-form">
    {% csrf_token %}
    <input type="hidden" name="suivant" value="{{ request.get_full_path }}">
    <button type="submit" class="like{% if aime or cible.pk in aimes %} actif{% endif %}"
            aria-pressed="{% if aime or cible.pk in aimes %}true{% else %}false{% endif %}"
            aria-label="{% if aime or cible.pk in aimes %}Retirer des favoris{% else %}Ajouter aux favoris{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3S4.8 15.8 4.8 10.9A4.3 4.3 0 0 1 12 8.1a4.3 4.3 0 0 1 7.2 2.8c0 4.9-7.2 9.4-7.2 9.4Z"/></svg>
      <span>{{ cible.nb_likes }}</span>
    </button>
  </form>
{% endif %}
