{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Rejoindre Aphrodite" %}{% endblock %}
{% block content %}
<section class="card">
  <h1>{% translate "Rejoindre Aphrodite" %}</h1>
  {% if erreur_limite %}<div class="alerte">{{ erreur_limite }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="formulaire">{% include "partials/champs.html" %}</div>
    <button type="submit" class="btn">{% translate "Créer mon compte" %}</button>
  </form>
</section>
{% endblock %}
