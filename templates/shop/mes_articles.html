{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Mes articles</h1>
  <a class="btn lien" href="{% url 'nouvel_article' %}">+ Publier un article</a>
</section>
<section class="card" style="margin-top:16px">
  {% for a in articles %}
    <div class="ligne">
      <div>
        <a href="{% url 'article' a.pk %}"><strong>{{ a.titre }}</strong></a><br>
        <span class="muted"><img class="cb" src="/static/images/cube_cubis.svg" alt="Cubis"> {{ a.prix_cubis }} · {% if a.est_actif %}visible{% else %}masqué{% endif %}</span>
      </div>
      <form method="post" action="{% url 'basculer_article' a.pk %}" class="inline">
        {% csrf_token %}
        <button type="submit" class="petit">{% if a.est_actif %}Masquer{% else %}Afficher{% endif %}</button>
      </form>
    </div>
  {% empty %}
    <p class="muted">Tu n'as encore rien publié.</p>
  {% endfor %}
</section>
{% endblock %}
