{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>{% if article %}Modifier l'article{% else %}Publier un article{% endif %}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">{% if article %}Enregistrer{% else %}Publier{% endif %}</button>
  </form>
  {% if article %}<p><a href="{% url 'article' article.pk %}">← Annuler</a></p>{% endif %}
</section>
{% endblock %}
